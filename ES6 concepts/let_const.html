<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Let and Const</title>
    <script>
      //var is function scope let is a block scope
      const b = "Hii Mani";
      {
        let a = "Hello";
        document.write(a+"<br>");
      }
      //    document.write("Mani "+a); // it shows some error let is only block scope of keyword
       //   b = "World";  //it's shows errors when overight 
      document.write(b);
    </script>
  </head>
  <body></body>
</html>
