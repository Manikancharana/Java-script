<!DOCTYPE html>
<html lang="en">
<head>
    <title></title>
</head>
<body>
    <script>
    var n= parseInt(prompt("Enter a number"))
      if(n<=1) document.write(n+" is not a prime number")
      else{
         var isprime=true;
      for(let i=2;i<Math.sqrt(n);i++){
        if(n%i==0){

     isprime=false;
        break;
        }
      }
    }
     if(isprime) {
        document.write("It's not a prime number")}

     else {
        document.write("It's a prime number")
     }
    </script>
</body>
</html>
